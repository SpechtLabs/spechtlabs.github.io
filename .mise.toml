# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how the website is built and checked. CI uses these
# tasks. Renovate keeps every pin in this file current.

[settings]
# The pins below are the only source of tool versions; mise never reads them
# from .nvmrc, .bun-version, package.json engines and friends.
idiomatic_version_file_enable_tools = []

[tools]
# VuePress builds under bun. bun runs the vuepress CLI through its
# `#!/usr/bin/env node` shebang, so node is the runtime the build really uses;
# markdownlint-cli2 is an npm package mise installs with this node too. Keep
# node in lockstep with engines.node and @types/node in package.json.
bun = "1.4.2"
node = "24.21.0"
markdownlint-cli2 = "0.23.3"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

[tasks.install]
description = "Install dependencies from the frozen Bun lockfile"
run = "bun install --frozen-lockfile"

[tasks.update]
description = "Update dependencies within their ranges and refresh bun.lock"
run = "bun update"

[tasks.dev]
description = "Serve the website locally with hot reload"
depends = ["install"]
run = "bun run dev"

[tasks.dev-clean]
description = "Serve the website locally with clean caches"
depends = ["install"]
run = "bun run dev-clean"

[tasks.build]
description = "Build the production website into docs/.vuepress/dist (the website workflow's build job)"
depends = ["install"]
run = "bun run build"

[tasks.preview]
description = "Build and serve the production website locally"
depends = ["build"]
run = "bun run preview"

[tasks.vp-update]
description = "Run the VuePress dependency updater"
depends = ["install"]
run = "bun run vp-update"

# `mise run fmt` rewrites what has a canonical form; `mise run lint` checks
# the same things without touching a file.
[tasks.fmt]
description = "Fix what markdownlint can fix in the website and the README"
run = "markdownlint-cli2 --fix"

[tasks.lint]
description = "Lint the Markdown, the VuePress config's TypeScript, YAML and workflows (the website workflow's lint job)"
depends = ["md-lint", "typecheck", "yaml-lint", "actionlint"]

# The globs live in .markdownlint-cli2.yaml, so the pre-commit hook, this task
# and an editor agree on what is linted.
[tasks.md-lint]
description = "Lint the website's Markdown and the README"
run = "markdownlint-cli2"

# tsconfig.json covers the .ts files under docs/.vuepress; the build compiles
# them with esbuild, which strips types without checking them.
[tasks.typecheck]
description = "Type-check the VuePress config and client"
depends = ["install"]
run = "bun run typecheck"

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.check]
description = "The definition of done: every gate CI runs"
depends = ["lint", "build"]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"
