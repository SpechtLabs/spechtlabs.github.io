name: Publish Website

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bun dependency and site build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up pinned tools
        uses: jdx/mise-action@v4

      - name: Verify dependencies and build
        run: mise run ci

      - name: Upload Artifact for Website
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/.vuepress/dist
          retention-days: 1

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      id-token: write
      pages: write

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download Artifacts for Website
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./dist

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-static-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      id-token: write
      pages: write

    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@main
        with:
          endpoint: https://pages.specht-labs.de
          site-dir: dist/
