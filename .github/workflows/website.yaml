name: Website

# Lints and builds the website for every pull request; a push to main, the
# daily schedule (or a run from the Actions tab) also publishes the build to
# GitHub Pages and to Specht Labs Static Pages. The whole repository is the
# website, so there is no path filter.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
  # Projects and contributors are fetched from the GitHub API at build time,
  # so rebuild daily to keep them current between pushes.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.5
  # Every tool a job here runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache: main's runs save it
  # and every pull request restores it, rather than each job keeping a copy
  # of its own subset.
  MISE_TOOLS: bun node markdownlint-cli2 yamllint actionlint shellcheck

# A new push to a pull request supersedes its run in flight. Pushes to main key
# on the SHA, so a deploy is never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint Markdown
        run: mise run md-lint

      - name: Type-check the VuePress config
        run: mise run typecheck

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # The install is frozen, so it fails when bun.lock and package.json
      # disagree.
      - name: Build
        run: mise run build
        env:
          # Authenticates the build-time GitHub API calls for projects and
          # contributors (60 requests/hour without it, 1,000 with it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact for Website
        # Only the deploy jobs consume this, and they run on push/dispatch/schedule.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs/.vuepress/dist
          retention-days: 1

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download Artifacts for Website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ./dist

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-static-pages:
    name: Deploy to Static Pages
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@ce26d01ba09df7fdcc4617f90a28a1423a6da93c # main
        with:
          endpoint: https://pages.specht-labs.de
          site-dir: dist/
